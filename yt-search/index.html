<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube — Newest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>[hidden]{display:none!important}#err{color:#ef4444;padding:12px;font:13px monospace;white-space:pre-wrap}</style>
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="../shared/tg-safe-area.css?v=5">
<script src="../shared/tg-safe-area.js?v=5"></script>
</head><body>
<header id="hdr" hidden><h1>YouTube — Newest First</h1><button id="gear" class="icon" title="Settings">⚙️</button></header>
<div id="gate" hidden class="gate"><div>📱</div><h2>Please open this app in Telegram</h2><p>This Mini App works only inside Telegram.</p><p id="gateInfo" style="font-size:12px"></p></div>
<main id="app" hidden>
  <div class="card" id="settings" hidden>
    <label for="key">YouTube Data API v3 key</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza…">
    <div class="hint">The key is stored only on this device (localStorage) and is sent directly to Google.</div>
    <button id="saveKey" type="button">Save key</button>
  </div>
  <div class="card">
    <label for="q">Query</label>
    <input id="q" type="search" enterkeyhint="search" placeholder="search query">
    <label for="from">From (not earlier)</label>
    <input id="from" type="datetime-local" step="60">
    <label for="to">To (not later)</label>
    <div class="from-wrap"><input id="to" type="datetime-local" step="60"><button type="button" class="now-btn" id="toNow">Now</button></div>
    <label for="kind">Type</label>
    <select id="kind"><option value="all">Shorts + videos</option><option value="shorts">Shorts only</option><option value="video">Videos only</option></select>
    <button id="go" type="button">Search</button>
    <div id="status"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager" hidden>
    <button type="button" id="prev" disabled>← Prev</button><span id="pageInfo"></span><button type="button" id="next" disabled>Next →</button>
  </div>
</main>
<div id="err" hidden></div>
<script src="app.js?v=5"></script>
</body></html>
