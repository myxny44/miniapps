<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube — новые</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head><body>
<header><h1>YouTube — сначала новые</h1><button id="gear" class="icon" title="Настройки">⚙️</button></header>
<main>
  <div class="card" id="settings" hidden>
    <label for="key">YouTube Data API v3 ключ</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza…">
    <div class="hint">Ключ хранится только в этом браузере (localStorage) и уходит напрямую в Google.</div>
    <button id="saveKey" type="button">Сохранить ключ</button>
  </div>
  <div class="card">
    <label for="q">Запрос</label>
    <input id="q" type="search" enterkeyhint="search" placeholder="поисковый запрос">
    <label for="from">От (не раньше)</label>
    <input id="from" type="datetime-local" step="60">
    <label for="to">До (не позже)</label>
    <div class="from-wrap"><input id="to" type="datetime-local" step="60"><button type="button" class="now-btn" id="toNow">Сейчас</button></div>
    <label for="kind">Тип</label>
    <select id="kind"><option value="all">Shorts + видео</option><option value="shorts">Только Shorts</option><option value="video">Только видео</option></select>
    <button id="go" type="button">Искать</button>
    <div id="status"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager" hidden>
    <button type="button" id="prev" disabled>← Назад</button><span id="pageInfo"></span><button type="button" id="next" disabled>Вперёд →</button>
  </div>
</main>
<script src="app.js"></script>
</body></html>
